name: Keep Alive Ping

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Ping website and database
        run: |
          curl -X GET https://your-app.vercel.app/api/ping
